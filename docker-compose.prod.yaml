services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: star_burger
      POSTGRES_USER: star_burger_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U star_burger_user -d star_burger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py collectstatic --noinput && gunicorn star_burger.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:1.21-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
  static_volume:
